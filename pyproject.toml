[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "match-predictor"
version = "0.1.0"
description = "Football match prediction pipeline using football-data.org."
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "xgboost>=3.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
match-predictor = "match_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
